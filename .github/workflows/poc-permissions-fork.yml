name: "POC-3: Missing Permissions & workflow_run Fork Validation"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["*"]
    types: [completed]

# INTENTIONALLY NO permissions block - demonstrating H-1

jobs:
  test-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: "PROOF: Check GITHUB_TOKEN scope without permissions block"
        run: |
          echo "=== PERMISSIONS TEST ==="
          echo ""
          echo "Without top-level 'permissions' block, GITHUB_TOKEN inherits repo defaults."
          echo "Checking token scope..."
          echo ""
          # Use the token to test what we can do
          curl -s -H "Authorization: token ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/permissions 2>/dev/null | head -20 || echo "(Could not read permissions)"
          echo ""
          echo "=== RISK ==="
          echo "If repo default = 'read-write', any job step can:"
          echo "  - Push commits (contents: write)"
          echo "  - Create releases"
          echo "  - Modify pull requests"
          echo "  - Upload packages"
          echo ""
          echo "For workflows triggered by pull_request from forks:"
          echo "  - Fork code runs with write access to your repo"
          echo "  - GITHUB_TOKEN could be used to push malicious commits"

  test-fork-validation:
    runs-on: ubuntu-latest
    steps:
      - name: "PROOF: workflow_run without fork check"
        run: |
          echo "=== WORKFLOW_RUN FORK VALIDATION TEST ==="
          echo ""
          echo "This workflow triggers on workflow_run from ANY workflow."
          echo "Current trigger info:"
          echo "  event_name: ${{ github.event_name }}"
          echo "  repository: ${{ github.repository }}"
          echo ""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Triggered by workflow_run:"
            echo "  head_repository: ${{ github.event.workflow_run.head_repository.full_name }}"
            echo "  head_branch: ${{ github.event.workflow_run.head_branch }}"
            echo ""
            if [ "${{ github.event.workflow_run.head_repository.full_name }}" != "${{ github.repository }}" ]; then
              echo "🚨 CRITICAL: workflow_run triggered from FORK repository!"
              echo "   This workflow now has access to ALL secrets."
              echo "   An attacker could exfiltrate secrets from the fork PR."
            else
              echo "✅ Source repository matches (same repo)"
            fi
          else
            echo "Not triggered by workflow_run (demonstration only)."
            echo ""
            echo "=== ATTACK SCENARIO ==="
            echo "1. Attacker forks the repo"
            echo "2. Attacker creates a PR that triggers daily-build workflow"
            echo "3. daily-build completes (with fork's code but no secrets)"
            echo "4. workflow_run event fires for release-android/release-ios"
            echo "5. release-android runs WITH SECRETS on default branch"
            echo "6. The workflow_run event carries fork's head_sha"
            echo "7. If the workflow checks out that sha, fork code runs with secrets"
            echo ""
            echo "WITHOUT the fork validation step, the workflow has NO defense."
            echo ""
            echo "FIX: Add this step to ALL workflow_run-triggered workflows:"
            echo '  - name: Validate workflow_run source'
            echo '    if: github.event_name == '\''workflow_run'\'''
            echo '    run: |'
            echo '      if [ "\${{ github.event.workflow_run.head_repository.full_name }}" != "\${{ github.repository }}" ]; then'
            echo '        echo "::error::Rejecting workflow_run from fork repository"'
            echo '        exit 1'
            echo '      fi'
          fi
