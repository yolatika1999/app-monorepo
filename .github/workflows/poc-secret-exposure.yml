name: "POC-1: Secret Exposure via Direct Interpolation"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-secret-exposure:
    runs-on: ubuntu-latest
    steps:
      # --- 危险写法: secret 直接插值到 run 脚本 ---
      - name: "VULNERABLE: Secret in run script (process args leak)"
        run: |
          echo "=== VULNERABLE PATTERN ==="
          # 模拟: echo ${{ secrets.SOME_SECRET }} | base64 -d > file
          # 用 GITHUB_TOKEN 演示, 它也会出现在 /proc/*/cmdline
          echo "TOKEN=${{ github.token }}" >> /tmp/test-vuln.txt
          echo "--- Process command line shows secret ---"
          # 在真实攻击中, 同 runner 其他进程可读取 /proc/PID/cmdline 获取 secret
          cat /proc/self/cmdline 2>/dev/null | tr '\0' ' ' || echo "(cmdline not readable, but on shared runners it is)"

      # --- 安全写法: secret 通过 env 块中转 ---
      - name: "SAFE: Secret via env block"
        env:
          SAFE_TOKEN: ${{ github.token }}
        run: |
          echo "=== SAFE PATTERN ==="
          echo "TOKEN=$SAFE_TOKEN" >> /tmp/test-safe.txt
          echo "Secret is only in environment, not in script text"

      # --- 演示: 直接插值时 secret 出现在脚本内容中 ---
      - name: "PROOF: Script text comparison"
        env:
          SAFE_TOKEN: ${{ github.token }}
        run: |
          echo "=== PROOF: Direct interpolation puts secret in script text ==="
          echo ""
          echo "1) VULNERABLE pattern generates script like:"
          echo '   echo "TOKEN=ghp_xxxxxxxxxxxx" >> file'
          echo "   -> Secret is LITERAL in the script. Any error reveals it."
          echo ""
          echo "2) SAFE pattern generates script like:"
          echo '   echo "TOKEN=$SAFE_TOKEN" >> file'
          echo "   -> Secret is ONLY in process environment, never in script text."
          echo ""
          echo "=== Simulating syntax error leak ==="
          # 如果直接插值的 secret 含特殊字符, shell 会报语法错误并显示完整行
          # 示例: echo ${{ secrets.KEY }} | base64 -d > file
          # 如果 KEY 包含引号或反引号, 错误消息会包含完整 secret 值
          echo "In a real attack, a malformed secret value causes shell syntax error"
          echo "that prints the ENTIRE secret value before GitHub masking kicks in."

      - name: "CLEANUP"
        run: rm -f /tmp/test-vuln.txt /tmp/test-safe.txt
